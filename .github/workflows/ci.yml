name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # Game files are never available on CI; corpus tests skip themselves.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  build-macos:
    # macOS is a development host only: build check, no tests, no release.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  # C++20 (ADR 0001): Linux GCC, Linux Clang with ASan/UBSan, Windows MSVC.
  # No game files on CI: corpus tests skip; tools/agree.py checks the
  # synthetic fixtures against the Python references.
  cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            preset: dev
            cc: gcc
            cxx: g++
          - name: linux-clang-asan
            os: ubuntu-latest
            preset: asan
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-latest
            preset: msvc
    name: cpp (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        # ninja; headers SDL3 needs for its X11/Wayland video and audio
        # backends (SDL docs/README-linux.md).
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev
          libwayland-dev wayland-protocols libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  cpp-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version used locally (formatting differs between versions).
      - run: pip install clang-format==23.1.3
      - run: find src -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror
