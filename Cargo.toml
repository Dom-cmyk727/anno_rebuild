[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anno-formats = { path = "crates/formats" }
anno-assets = { path = "crates/assets" }
anno-sim = { path = "crates/sim" }
anno-net = { path = "crates/net" }
anno-render = { path = "crates/render" }
anno-ui = { path = "crates/ui" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
cast_possible_truncation = "warn"

# Pixel decoding and rendering are far too slow unoptimised for the corpus
# tests (a scenario render took ~250 s); optimise those crates and all
# dependencies even in dev/test builds. Binaries keep debug settings.
[profile.dev.package.anno-formats]
opt-level = 2

[profile.dev.package.anno-assets]
opt-level = 2

[profile.dev.package.anno-render]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
