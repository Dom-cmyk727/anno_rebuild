name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # What kind of change this run checks. A change that touches only docs/ or the
  # Markdown files at the repository root (CLAUDE.md, README.md) builds and tests
  # nothing: no build step, test or reference script reads those files (checked
  # 2026-11-10). Everything else (src/, tools/, data/, fixtures/, .github/, ...)
  # is code. Any doubt (no usable base, an empty diff, a git error) means code.
  # Base: a pull request's base; for main, the commit before the push; for any
  # other branch, its merge base with main, so a branch is always checked as a
  # whole against main and a later docs-only commit cannot hide an earlier one.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          code=true
          base=
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)
              if [ "$REF" = refs/heads/main ]; then base="$BEFORE"
              else base=$(git merge-base origin/main HEAD 2>/dev/null || true); fi ;;
          esac
          # --no-renames: a file moved out of src/ into docs/ lists its old path too.
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null \
             && git diff --name-only --no-renames "$base" HEAD > changed.txt \
             && [ -s changed.txt ]; then
            echo "files changed since $base: $(wc -l < changed.txt)"
            head -n 100 changed.txt
            if ! grep -qvE '^docs/|^[^/]+\.md$' changed.txt; then code=false; fi
          else
            echo "no usable base (event $EVENT, ref $REF, base '${base}'): a code change"
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # Game files are never available on CI; corpus tests skip themselves.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets

  build-macos:
    # macOS is a development host only: build check, no tests, no release.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  # C++20 (ADR 0001): Linux GCC, Linux Clang with ASan/UBSan, Windows MSVC.
  # No game files on CI: corpus tests skip; tools/agree.py checks the
  # synthetic fixtures against the Python references.
  cpp:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            preset: dev
            cc: gcc
            cxx: g++
          # Optimised GCC: some warnings (-Wstringop-overflow) appear only
          # at -O2/-O3, which the dev preset does not use.
          - name: linux-gcc-release
            os: ubuntu-latest
            preset: release
            cc: gcc
            cxx: g++
          - name: linux-clang-asan
            os: ubuntu-latest
            preset: asan
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-latest
            preset: msvc
          # macOS is a development host only: build and test check.
          - name: macos-clang
            os: macos-latest
            preset: dev
            cc: clang
            cxx: clang++
    name: cpp (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        # ninja; headers SDL3 needs for its X11/Wayland video and audio
        # backends (SDL docs/README-linux.md).
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev
          libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev
      - if: runner.os == 'Linux' && matrix.name == 'linux-gcc'
        # T13: Mesa's software Vulkan driver (lavapipe) so the GPU parity tests
        # run on a real adapter in this job only (OQ-089). linux-gcc only.
        run: sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - if: runner.os == 'macOS'
        run: brew install ninja
      - name: evidence preflight before configure and build
        shell: bash
        run: |
          python3 -I tools/test/run_selected.py --preflight-only
          python3 -I tools/test/workflow_test.py
      - run: cmake --preset ${{ matrix.preset }}
      - name: build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log
      # Job logs need a login to read; annotations do not. On failure, the
      # first compiler errors become annotations (packed into a few, as the
      # number of annotations per step is limited).
      - name: compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          grep -E "error|warning C[0-9]{4}|Error" build.log | grep -v "^-- " | head -60 > errors.txt || true
          split -l 12 errors.txt part_
          for f in part_*; do
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=build errors::${msg}"
          done
      - name: test
        shell: bash
        run: |
          set -o pipefail
          # T13: linux-gcc runs the GPU parity tests on lavapipe (Mesa's software
          # Vulkan driver). A missing adapter must fail the job, not skip (OQ-089).
          if [ "${{ matrix.name }}" = "linux-gcc" ]; then
            export ANNO_REQUIRE_GPU=1
            export WGPU_BACKEND=vulkan
            # Mesa's lavapipe ICD (path/name can vary by distro; pick any *lvp* ICD).
            export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/*lvp*.json 2>/dev/null | head -n 1)"
            if [ -n "$VK_ICD_FILENAMES" ]; then
              echo "adapter: WGPU_BACKEND=vulkan, VK_ICD_FILENAMES=$VK_ICD_FILENAMES (lavapipe), ANNO_REQUIRE_GPU=1"
            else
              echo "::warning title=lavapipe ICD not found::no *lvp* ICD in /usr/share/vulkan/icd.d; letting the Vulkan loader scan the default directory"
              ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || true
            fi
            vulkaninfo --summary 2>&1 | grep -iE "device name|api version|Driver version|llvmpipe|lavapipe" || true
          fi
          # Each doctest case is its own test (anno_add_doctest): run them on
          # the runner's cores (4 on the hosted Linux and Windows runners).
          # windows-msvc leaves out the GPU cases (label "gpu"): the hosted
          # Windows runner's only adapter is the WARP software rasterizer, on
          # which they take about 50 s each, one at a time (RESOURCE_LOCK gpu):
          # 43 of the job's 54 minutes (run 39926764589) for a parity check
          # that linux-gcc makes deterministically on lavapipe (OQ-089). The
          # MSVC build of the GPU code is still checked; the owner's 4090 runs
          # the cases locally (docs/testing/gpu-tests.md).
          GATE_ARGS=(--build-dir "build/${{ matrix.preset }}" --select . --jobs 4
                     --log test.log --asset-policy unavailable)
          if [ "${{ matrix.name }}" = "windows-msvc" ]; then
            GATE_ARGS+=(--exclude-label gpu --config Release)
          fi
          if [ "${{ matrix.name }}" != "linux-gcc" ]; then
            GATE_ARGS+=(--allow-skip gpu)
          fi
          python3 -I tools/test/run_selected.py "${GATE_ARGS[@]}"
      - name: preserve test evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.name }}
          path: |
            test.log
            test.log.inventory.json
          if-no-files-found: ignore
      # T13: linux-gcc pins lavapipe with ANNO_REQUIRE_GPU=1 so the GPU parity
      # tests run there deterministically instead of skipping; the other jobs
      # still warn when they skip (the step can still fire on macos-clang,
      # linux-clang-asan, linux-gcc-release; windows-msvc leaves the GPU cases
      # out, see the test step).
      - name: GPU tests need an adapter (loud skip)
        if: matrix.name != 'windows-msvc'
        shell: bash
        run: |
          if ctest --preset ${{ matrix.preset }} -V -R "the shared WGSL shaders compile" 2>&1 | grep -q "skipping:"; then
            if [ "${{ matrix.name }}" = "linux-gcc" ]; then
              # T13: linux-gcc runs lavapipe with ANNO_REQUIRE_GPU=1, so a missing
              # adapter must fail the job instead of skipping (OQ-089).
              echo "::error title=GPU tests skipped::no GPU adapter on linux-gcc (lavapipe); the river-flow shader parity tests did not run (OQ-089)"
              exit 1
            fi
            echo "::warning title=GPU tests skipped::no GPU adapter on this runner, the shader parity tests of the river flow (gpu_test.cpp) did not run (OQ-089)"
          fi
      - name: test failures as annotations
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] || exit 0
          grep -E "ERROR|FATAL|Failed|failed|FAIL |error|mismatch|values:|^ +(dump|python):|exit [0-9]" test.log | head -60 > fails.txt || true
          split -l 12 fails.txt tpart_
          for f in tpart_*; do
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error title=test failures::${msg}"
          done

  cpp-format:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version used locally (formatting differs between versions).
      - run: pip install clang-format==23.1.3
      - run: find src -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

  # The one required check of main's branch protection (2026-11-10,
  # docs/orchestration/STATUS.md "Landing on main"). It passes only when every
  # job above succeeded, or, for a docs-only change, was skipped. It runs even
  # after a failure or cancellation (always()), because GitHub counts a skipped
  # required check as passed. Re-running failed jobs re-runs this one too.
  gate:
    name: gate
    if: always()
    needs: [changes, lint, test, build-macos, cpp, cpp-format]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "code change: '${CODE}'"
          python3 -I -c 'import json, os; [print(k, v["result"]) for k, v in json.loads(os.environ["NEEDS"]).items()]' > results.txt
          cat results.txt
          fail=0
          case "$CODE" in true|false) ;; *) echo "::error title=gate::no change classification"; fail=1 ;; esac
          while read -r job result; do
            if [ "$result" = success ]; then continue; fi
            if [ "$job" != changes ] && [ "$result" = skipped ] && [ "$CODE" = false ]; then continue; fi
            echo "::error title=gate::${job}: ${result}"
            fail=1
          done < results.txt
          exit "$fail"
